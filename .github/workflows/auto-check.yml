name: Автопроверка лабораторной работы

on:
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened]

jobs:
  check-lab-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверка структуры и кода
        id: checks
        run: |
          # ВАЖНО: отключаем выход по ошибке, чтобы grep не ронял скрипт
          set +e
          
          echo "Начинаем проверку..."
          
          # 1. Проверка отчета
          REPORT_COUNT=$(find . -type f \( -name "report.md" -o -name "*.ipynb" \) | grep -v ".github" | wc -l)
          if [ "$REPORT_COUNT" -gt 0 ]; then
            echo "has_report=true" >> $GITHUB_OUTPUT
            echo "Отчет найден"
          else
            echo "has_report=false" >> $GITHUB_OUTPUT
            echo "Отчет не найден"
          fi
          
          # 2. Проверка requirements.txt
          if [ -f "requirements.txt" ]; then
            if grep -qi "streamlit" requirements.txt && grep -qi "plotly" requirements.txt; then
              echo "has_reqs=true" >> $GITHUB_OUTPUT
              echo "requirements.txt корректен"
            else
              echo "has_reqs=false" >> $GITHUB_OUTPUT
              echo "В requirements.txt не хватает streamlit или plotly"
            fi
          else
            echo "has_reqs=false" >> $GITHUB_OUTPUT
            echo "Файл requirements.txt отсутствует"
          fi
          
          # 3. Проверка ML-моделей
          ML_FOUND=$(grep -rl "RandomForestRegressor\|LinearRegression" --include="*.py" --include="*.ipynb" . 2>/dev/null | wc -l)
          if [ "$ML_FOUND" -gt 0 ]; then
            echo "has_ml=true" >> $GITHUB_OUTPUT
            echo "ML-модели найдены"
          else
            echo "has_ml=false" >> $GITHUB_OUTPUT
            echo "ML-модели не найдены"
          fi
          
          # 4. Проверка Plotly
          PLOTLY_FOUND=$(grep -rl "plotly\|go.Scatter\|go.Scatter3d" --include="*.py" --include="*.ipynb" . 2>/dev/null | wc -l)
          if [ "$PLOTLY_FOUND" -gt 0 ]; then
            echo "has_plotly=true" >> $GITHUB_OUTPUT
            echo "Plotly найден"
          else
            echo "has_plotly=false" >> $GITHUB_OUTPUT
            echo "Plotly не найден"
          fi
          
          # 5. Ключевые слова (без русских символов для надёжности)
          KEYWORDS_FOUND=$(grep -rli "RTS\|target\|deviation\|RandomForest\|Scatter" --include="*.md" --include="*.ipynb" . 2>/dev/null | wc -l)
          if [ "$KEYWORDS_FOUND" -gt 0 ]; then
            echo "has_keywords=true" >> $GITHUB_OUTPUT
            echo "Ключевые слова найдены"
          else
            echo "has_keywords=false" >> $GITHUB_OUTPUT
            echo "Ключевые слова не найдены"
          fi
          
          set -e

      - name: Публикация комментария в PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Результат автоматической проверки
            
            Здравствуйте, @${{ github.actor }}! Ваш Pull Request проверен.

            #### Чек-лист:
            ${{ steps.checks.outputs.has_report == 'true' && '- [x] Отчет/Notebook присутствует' || '- [ ] Отчет/Notebook ОТСУТСТВУЕТ' }}
            ${{ steps.checks.outputs.has_reqs == 'true' && '- [x] Зависимости корректны' || '- [ ] Зависимости некорректны' }}
            ${{ steps.checks.outputs.has_ml == 'true' && '- [x] ML-модели используются' || '- [ ] ML-модели не найдены' }}
            ${{ steps.checks.outputs.has_plotly == 'true' && '- [x] Визуализация реализована' || '- [ ] Визуализация не найдена' }}
            ${{ steps.checks.outputs.has_keywords == 'true' && '- [x] Ключевые термины присутствуют' || '- [ ] Ключевые термины отсутствуют' }}

            Если пункты отмечены как `[ ]`, внесите исправления и сделайте новый `git push`.
            
            *Сгенерировано GitHub Actions для курса "Генеративный ИИ и МО"*
